name: 自家爬虫自动更新

on:
  schedule:
    # 每 1 小时跑一次（UTC 时间，错开整点高峰用 17 分）
    - cron: "17 */1 * * *"
  workflow_dispatch: # 允许在 Actions 页面手动点运行

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyyaml

      - name: 运行爬虫
        run: python aggregator.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash-udl4ke8um5.yaml stats.txt
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "自动更新节点 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
